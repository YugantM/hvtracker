name: Corrections monitor

# /correct/ promises a reply to correction requests within about a week, but
# #216 (HOL Guard) sat unanswered for 24 days because nothing surfaced it.
# Daily: opens (or updates) a `correction-overdue` issue listing every open
# "[Correction]" issue older than 5 days with no maintainer reply, and closes
# it again once none are left.

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Find overdue correction requests
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
            --json number,title,createdAt,url,comments > issues.json
          out=$(python scripts/check_corrections.py issues.json); code=$?
          echo "$out"
          {
            echo "report<<EOF"
            echo "$out"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ $code -eq 2 ]; then echo "state=alert" >> "$GITHUB_OUTPUT";
          elif [ $code -eq 0 ]; then echo "state=ok" >> "$GITHUB_OUTPUT";
          else echo "state=error" >> "$GITHUB_OUTPUT"; fi

      - name: Open or update correction-overdue issue
        if: steps.check.outputs.state == 'alert' || steps.check.outputs.state == 'error'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through env, never pasted into the script: issue titles are user input.
          REPORT: ${{ steps.check.outputs.report }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body=$(printf 'Correction requests waiting longer than /correct/ promises:\n\n```\n%s\n```\n\nRun: %s\n' "$REPORT" "$run_url")
          gh label create correction-overdue --repo "$GITHUB_REPOSITORY" --color D93F0B --description "A correction request is past its reply window" 2>/dev/null || true
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label correction-overdue --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Correction requests are overdue" --label correction-overdue --body "$body"
          fi

      - name: Close correction-overdue issue when clear
        if: steps.check.outputs.state == 'ok'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label correction-overdue --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "Every correction request has a reply."
          fi
