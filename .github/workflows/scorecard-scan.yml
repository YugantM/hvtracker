name: Scorecard scan

on:
  schedule:
    # One SHARD per run, six runs spread across the day. The scorecard CLI
    # burns a few thousand GitHub API calls per ~55-repo shard, so two shards
    # back-to-back exhaust the PAT's 5k/hr quota and the next shard starves:
    # every repo stalls to the 300s timeout until the hosted runner gets
    # reclaimed (observed kills at 8 and 25 minutes on 2026-07-11 — reclaim
    # timing is arbitrary, and killed runners never reach the artifact-upload
    # step, so the shard publishes nothing). Giving each shard its own quota
    # window removes the contention entirely; each repo still gets scanned
    # once a day.
    - cron: "0 1,5,9,13,17,21 * * *"
  workflow_dispatch:
    inputs:
      shard:
        description: "Shard 1-6 to scan (empty = derived from current UTC hour)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SCORECARD_VERSION: "v5.5.0"

jobs:
  # One shard (~55 repos, ~25 min) per run. The shard self-limits to a time
  # budget, aborts on consecutive timeouts (quota-exhaustion signature), and
  # writes its cache incrementally; repos a cutoff misses keep prior values
  # (freshest-wins merge) and lead the next run's stalest-first queue, so
  # coverage converges within the day instead of starving a fixed tail.
  # Re-count shards when the roster passes ~420.
  scan:
    runs-on: ubuntu-latest
    outputs:
      shard: ${{ steps.pick.outputs.shard }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      # Scheduled runs rotate through shards by UTC-hour bucket (cron hours
      # 1,5,9,... → shards 1..6). hour/4 bucketing tolerates GitHub's cron
      # delays of up to ~4h without skipping a shard. Manual dispatches may
      # pin a shard explicitly.
      - name: Pick shard
        id: pick
        run: |
          shard="${{ github.event.inputs.shard }}"
          if [ -z "$shard" ]; then
            shard=$(( (10#$(date -u +%H) / 4) % 6 + 1 ))
          fi
          echo "shard=$shard" >> "$GITHUB_OUTPUT"
          echo "Scanning shard $shard/6"

      - name: Download scorecard CLI
        run: |
          curl -sL "https://github.com/ossf/scorecard/releases/download/${SCORECARD_VERSION}/scorecard_${SCORECARD_VERSION#v}_linux_amd64.tar.gz" \
            | tar xz scorecard
          chmod +x scorecard
          ./scorecard version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The prior cache drives stalest-first ordering (never-scanned repos
      # first, then oldest scanned_at). Shard output still contains only
      # freshly-scanned repos; the merge job overlays them freshest-wins.
      - name: Seed prior cache from data branch
        run: |
          if git fetch origin data 2>/dev/null && git cat-file -e origin/data:scorecard-cache.json 2>/dev/null; then
            git show origin/data:scorecard-cache.json > scorecard-cache.json
          fi

      - name: Run scorecard scan
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python scan_scorecards.py --shard ${{ steps.pick.outputs.shard }}/6

      # if: always() — partial results from a failed step are still valid
      # (incremental writes mean the file reflects every completed repo).
      # A reclaimed runner never reaches this step; those repos heal on the
      # next run via the stalest-first queue.
      - name: Upload shard cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-shard-${{ steps.pick.outputs.shard }}
          path: scorecard-cache.json
          retention-days: 2

  # Overlay the fresh shards onto the prior data-branch cache (freshest-wins),
  # so a shard that failed this run keeps its last-known scores. Runs even if a
  # shard failed, to publish the shards that succeeded.
  merge:
    needs: scan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Download shard caches
        uses: actions/download-artifact@v4
        with:
          path: shards
          pattern: scorecard-shard-*

      - name: Merge shards and push to data branch
        run: |
          # A scan killed by runner reclaim uploads no artifact; an unguarded
          # glob then passes a literal path and the merge crashes (2026-07-11
          # run 29151228066). Nothing to merge = nothing to do; the scan
          # failure already routes to the alert job.
          if ! ls shards/scorecard-shard-*/scorecard-cache.json >/dev/null 2>&1; then
            echo "No shard artifacts to merge."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Base = current data-branch cache (authoritative, via git not CDN).
          if git fetch origin data 2>/dev/null && git cat-file -e origin/data:scorecard-cache.json 2>/dev/null; then
            git show origin/data:scorecard-cache.json > base.json
          else
            echo '{"agents":{}}' > base.json
          fi

          python merge_scorecard_shards.py base.json shards/scorecard-shard-*/scorecard-cache.json > merged.json
          cp merged.json /tmp/scorecard-cache.json

          # Use -B <branch> <start-point> so "data" is unambiguously a branch
          # name: the repo has a tracked data/ directory, so a bare
          # `git checkout data` is ambiguous (path vs branch) and aborts.
          if git fetch origin data 2>/dev/null; then
            git checkout -B data origin/data
          else
            git checkout --orphan data
            git rm -rf . 2>/dev/null || true
          fi

          cp /tmp/scorecard-cache.json scorecard-cache.json
          git add scorecard-cache.json
          if git diff --cached --quiet; then
            echo "No changes to scorecard cache."
          else
            git commit -m "chore: update scorecard cache $(date -u '+%Y-%m-%d')"
            git push origin data
          fi

  # Never let a broken scan go silent: open (or comment on) a tracking issue so
  # a dead scan is noticed before users notice stale scores.
  alert:
    needs: [scan, merge]
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Open or update failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="Scorecard scan run failed: ${run_url} ($(date -u '+%Y-%m-%d %H:%M UTC')). The data-branch cache may not have refreshed; site scores can go stale until this is fixed."
          # The alert job has no checkout, so gh can't infer the repo — pass
          # --repo explicitly or the label create (and issue create) fail.
          gh label create scan-failure --repo "$GITHUB_REPOSITORY" --color B60205 --description "OSSF scorecard scan is failing" 2>/dev/null || true
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label scan-failure --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Scorecard scan failing" --label scan-failure --body "$body"
          fi
