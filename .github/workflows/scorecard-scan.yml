name: Scorecard scan

on:
  schedule:
    # Every other day at 04:00 UTC (Sun/Tue/Thu/Sat)
    - cron: "0 4 * * 0,2,4,6"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SCORECARD_VERSION: "v5.5.0"

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download scorecard CLI
        run: |
          curl -sL "https://github.com/ossf/scorecard/releases/download/${SCORECARD_VERSION}/scorecard_${SCORECARD_VERSION#v}_linux_amd64.tar.gz" \
            | tar xz scorecard
          chmod +x scorecard
          ./scorecard version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run scorecard scan
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python scan_scorecards.py

      - name: Commit and push scorecard cache to data branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp scorecard-cache.json /tmp/scorecard-cache.json

          # Switch to orphan data branch (create if missing)
          if git fetch origin data 2>/dev/null; then
            git checkout data
          else
            git checkout --orphan data
            git rm -rf . 2>/dev/null || true
          fi

          cp /tmp/scorecard-cache.json scorecard-cache.json
          git add scorecard-cache.json
          if git diff --cached --quiet; then
            echo "No changes to scorecard cache."
          else
            git commit -m "chore: update scorecard cache $(date -u '+%Y-%m-%d')"
            git push origin data
          fi
