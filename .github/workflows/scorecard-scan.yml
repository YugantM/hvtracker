name: Scorecard scan

on:
  schedule:
    # One SHARD per run, 24 runs spread across the day (hourly). Each shard is
    # ~61 repos and completes inside the ~1800s runner budget; the full live
    # roster (~1,467 repos, fetched fresh each run — see "Fetch live roster")
    # is therefore rescanned once every 24h. The scorecard CLI burns a few
    # thousand GitHub API calls per shard, so back-to-back shards would exhaust
    # the PAT's 5k/hr quota and starve the next one (every repo stalls to the
    # timeout until the hosted runner is reclaimed — observed 2026-07-11 —
    # and a killed runner uploads nothing). One shard per hour = one shard per
    # 5k/hr window, so the scan never contends with itself; the script's
    # rate-limit breaker also backs off if the shared PAT (which serves prod's
    # 30-min signals refresh too) is momentarily depleted.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      shard:
        description: "Shard 1-24 to scan (empty = derived from current UTC hour)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SCORECARD_VERSION: "v5.5.0"

jobs:
  # One shard (~61 repos, ~30 min) per run. The shard self-limits to a time
  # budget, aborts on consecutive timeouts (quota-exhaustion signature), and
  # writes its cache incrementally; repos a cutoff misses keep prior values
  # (freshest-wins merge) and lead the next run's stalest-first queue, so
  # coverage converges within the day instead of starving a fixed tail.
  # The roster scanned is the LIVE prod board, not this repo's agents.json
  # (main lags prod by the unmerged MCP/skills roster — scanning agents.json
  # left ~1,000 live agents permanently unscored). Re-count shards when the
  # live roster passes ~1,580 (budget completes ~66/shard).
  scan:
    runs-on: ubuntu-latest
    outputs:
      shard: ${{ steps.pick.outputs.shard }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      # Scheduled runs rotate through shards by UTC hour (hour 0→shard 1 …
      # hour 23→shard 24). A late cron now shifts the shard rather than
      # skipping it; the stalest-first queue heals any hour that is missed
      # entirely. Manual dispatches may pin a shard explicitly.
      - name: Pick shard
        id: pick
        run: |
          shard="${{ github.event.inputs.shard }}"
          if [ -z "$shard" ]; then
            shard=$(( 10#$(date -u +%H) % 24 + 1 ))
          fi
          echo "shard=$shard" >> "$GITHUB_OUTPUT"
          echo "Scanning shard $shard/24"

      - name: Download scorecard CLI
        run: |
          curl -sL "https://github.com/ossf/scorecard/releases/download/${SCORECARD_VERSION}/scorecard_${SCORECARD_VERSION#v}_linux_amd64.tar.gz" \
            | tar xz scorecard
          chmod +x scorecard
          ./scorecard version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Replace the checked-out agents.json with the roster the SITE actually
      # serves. main's agents.json trails production by the unmerged MCP/skills
      # ingest (~1,000 rows), so scanning the checked-out file left the
      # majority of live agents with no OSSF score forever. /data/latest.json
      # carries repo + listing_status for every board row; we normalise it to
      # scan_scorecards.py's agents.json shape (all live rows count as
      # "listed"). Cloudflare blocks default UAs, hence the browser UA. On any
      # failure — fetch error, or an implausibly small roster — we KEEP the
      # checked-out agents.json so a bad edge response can't shrink coverage.
      - name: Fetch live roster
        run: |
          curl -sfL -A "Mozilla/5.0 (scorecard-scan)" \
            "https://hvtracker.net/data/latest.json?cb=$(date -u +%s)" \
            -o live.json || { echo "roster fetch failed; keeping checked-out agents.json"; exit 0; }
          python - <<'PY'
          import json, sys
          try:
              rows = json.load(open("live.json")).get("agents") or []
          except Exception as e:
              print(f"parse failed ({e}); keeping checked-out agents.json"); sys.exit(0)
          roster = [{"repo": r["repo"], "listing_status": "listed"}
                    for r in rows if r.get("repo")]
          # Guard against a truncated/edge-error response shrinking coverage.
          if len(roster) < 400:
              print(f"live roster only {len(roster)} rows; keeping checked-out agents.json")
              sys.exit(0)
          json.dump(roster, open("agents.json", "w"), indent=2)
          print(f"live roster: {len(roster)} repos written to agents.json")
          PY

      # The prior cache drives stalest-first ordering (never-scanned repos
      # first, then oldest scanned_at). Shard output still contains only
      # freshly-scanned repos; the merge job overlays them freshest-wins.
      - name: Seed prior cache from data branch
        run: |
          if git fetch origin data 2>/dev/null && git cat-file -e origin/data:scorecard-cache.json 2>/dev/null; then
            git show origin/data:scorecard-cache.json > scorecard-cache.json
          fi

      - name: Run scorecard scan
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python scan_scorecards.py --shard ${{ steps.pick.outputs.shard }}/24

      # if: always() — partial results from a failed step are still valid
      # (incremental writes mean the file reflects every completed repo).
      # A reclaimed runner never reaches this step; those repos heal on the
      # next run via the stalest-first queue.
      - name: Upload shard cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-shard-${{ steps.pick.outputs.shard }}
          path: scorecard-cache.json
          retention-days: 2

  # Overlay the fresh shards onto the prior data-branch cache (freshest-wins),
  # so a shard that failed this run keeps its last-known scores. Runs even if a
  # shard failed, to publish the shards that succeeded.
  merge:
    needs: scan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Download shard caches
        uses: actions/download-artifact@v4
        with:
          path: shards
          pattern: scorecard-shard-*

      - name: Merge shards and push to data branch
        run: |
          # A scan killed by runner reclaim uploads no artifact; an unguarded
          # glob then passes a literal path and the merge crashes (2026-07-11
          # run 29151228066). Nothing to merge = nothing to do; the scan
          # failure already routes to the alert job.
          if ! ls shards/scorecard-shard-*/scorecard-cache.json >/dev/null 2>&1; then
            echo "No shard artifacts to merge."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Base = current data-branch cache (authoritative, via git not CDN).
          if git fetch origin data 2>/dev/null && git cat-file -e origin/data:scorecard-cache.json 2>/dev/null; then
            git show origin/data:scorecard-cache.json > base.json
          else
            echo '{"agents":{}}' > base.json
          fi

          python merge_scorecard_shards.py base.json shards/scorecard-shard-*/scorecard-cache.json > merged.json
          cp merged.json /tmp/scorecard-cache.json

          # Use -B <branch> <start-point> so "data" is unambiguously a branch
          # name: the repo has a tracked data/ directory, so a bare
          # `git checkout data` is ambiguous (path vs branch) and aborts.
          if git fetch origin data 2>/dev/null; then
            git checkout -B data origin/data
          else
            git checkout --orphan data
            git rm -rf . 2>/dev/null || true
          fi

          cp /tmp/scorecard-cache.json scorecard-cache.json
          git add scorecard-cache.json
          if git diff --cached --quiet; then
            echo "No changes to scorecard cache."
          else
            git commit -m "chore: update scorecard cache $(date -u '+%Y-%m-%d')"
            git push origin data
          fi

  # Never let a broken scan go silent: open (or comment on) a tracking issue so
  # a dead scan is noticed before users notice stale scores.
  alert:
    needs: [scan, merge]
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Open or update failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="Scorecard scan run failed: ${run_url} ($(date -u '+%Y-%m-%d %H:%M UTC')). The data-branch cache may not have refreshed; site scores can go stale until this is fixed."
          # The alert job has no checkout, so gh can't infer the repo — pass
          # --repo explicitly or the label create (and issue create) fail.
          gh label create scan-failure --repo "$GITHUB_REPOSITORY" --color B60205 --description "OSSF scorecard scan is failing" 2>/dev/null || true
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label scan-failure --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Scorecard scan failing" --label scan-failure --body "$body"
          fi
