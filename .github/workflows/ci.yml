name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      mcp_only: ${{ steps.changed.outputs.mcp_only }}
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile all Python sources (syntax check)
        run: python -m compileall -q .

      - name: Detect MCP-only change
        if: github.event_name != 'workflow_dispatch'
        id: changed
        run: |
          git diff --name-only HEAD^1 HEAD > /tmp/changed-files.txt
          cat /tmp/changed-files.txt
          if grep -Ev '^(app\.py|mcp_server\.py|mcp_trust\.py|tests/test_mcp\.py|tests/test_mcp_trust\.py|\.github/workflows/ci\.yml)$' /tmp/changed-files.txt; then
            echo "mcp_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "mcp_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run focused MCP tests
        if: github.event_name != 'workflow_dispatch' && steps.changed.outputs.mcp_only == 'true'
        run: python -m pytest tests/test_mcp.py tests/test_mcp_trust.py

      - name: Run unit and data-integrity tests
        if: github.event_name == 'workflow_dispatch' || steps.changed.outputs.mcp_only != 'true'
        run: python -m pytest

      - name: Lint Python (ruff)
        run: ruff check .

      - name: Audit dependencies (pip-audit)
        continue-on-error: true
        run: pip-audit -r requirements.txt

      - name: Lint shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck cron_runner.sh

  build-smoke:
    # Verify the site actually renders from cached state (no network/API calls).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name != 'pull_request' && needs.test.outputs.mcp_only != 'true')
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Render-only build
        run: python fetch_and_build.py --render-only

      - name: Assert key artifacts were produced
        run: |
          test -s index.html
          test -s data.json
          python -c "import json; json.load(open('data.json'))"

      - name: Validate rendered HTML (sample pages)
        run: python tests/validate_html.py

  production-smoke:
    # Do not gate main-branch deploys on a post-deploy health poll. Railway
    # may be configured to wait for GitHub checks before rolling out, which
    # would deadlock this job against the deploy it is trying to observe.
    # Keep it available for manual verification runs instead.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build-smoke
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compute expected deploy markers
        id: expected
        run: |
          EXPECTED_CATALOG_AGENTS=$(python - <<'PY'
          import json
          print(len(json.load(open("agents.json"))))
          PY
          )
          EXPECTED_RENDER_AGENTS=$(python - <<'PY'
          import json
          print(len(json.load(open("data/render_state.json"))["rows"]))
          PY
          )
          EXPECTED_FP=$(python - <<'PY'
          import app
          print(app._compute_render_fingerprint())
          PY
          )
          echo "catalog_agents=${EXPECTED_CATALOG_AGENTS}" >> "$GITHUB_OUTPUT"
          echo "render_agents=${EXPECTED_RENDER_AGENTS}" >> "$GITHUB_OUTPUT"
          echo "fingerprint=${EXPECTED_FP}" >> "$GITHUB_OUTPUT"

      - name: Wait for production to report this build
        env:
          EXPECTED_CATALOG_AGENTS: ${{ steps.expected.outputs.catalog_agents }}
          EXPECTED_RENDER_AGENTS: ${{ steps.expected.outputs.render_agents }}
          EXPECTED_FINGERPRINT: ${{ steps.expected.outputs.fingerprint }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request

          expected_catalog_agents = int(os.environ["EXPECTED_CATALOG_AGENTS"])
          expected_render_agents = int(os.environ["EXPECTED_RENDER_AGENTS"])
          expected_fp = os.environ["EXPECTED_FINGERPRINT"]
          expected_sha = os.environ["EXPECTED_SHA"]
          deadline = time.time() + 900
          last = None
          url = "https://hvtracker.net/healthz?source=github-actions"
          headers = {
              "Accept": "application/json",
              # Cloudflare sometimes blocks Python's default urllib user agent.
              # Use a plain browser-like UA so the production smoke check
              # verifies deploy markers instead of tripping bot heuristics.
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/137.0.0.0 Safari/537.36"
              ),
              "Cache-Control": "no-cache",
              "Pragma": "no-cache",
          }

          while time.time() < deadline:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      last = json.loads(resp.read().decode("utf-8"))
              except Exception as exc:
                  last = {"error": str(exc)}
              else:
                  sha = last.get("git_sha")
                  sha_ok = (not sha) or sha == expected_sha
                  agents_ok = last.get("agents") == expected_render_agents
                  render_agents_ok = last.get("source_render_agents") == expected_render_agents
                  catalog_ok = last.get("catalog_agents") == expected_catalog_agents
                  fp_ok = last.get("source_render_fingerprint") == expected_fp
                  sync_ok = last.get("stored_render_fingerprint") == expected_fp and last.get("render_in_sync") is True
                  if sha_ok and agents_ok and render_agents_ok and catalog_ok and fp_ok and sync_ok:
                      print("Production matches expected build markers.")
                      print(json.dumps(last, indent=2, sort_keys=True))
                      sys.exit(0)
              print("Waiting for production deploy...", json.dumps(last, sort_keys=True))
              time.sleep(15)

          print("Production did not converge to expected deploy markers in time.")
          print(json.dumps(last, indent=2, sort_keys=True))
          sys.exit(1)
          PY
