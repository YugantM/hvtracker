name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Auto-deploy after the leaderboard build commits regenerated output.
  # Bot commits made with GITHUB_TOKEN do not trigger `push`, so without this
  # the live site would only update on human pushes / manual dispatch.
  workflow_run:
    workflows: ["Update leaderboard"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Skip when the triggering build failed (it committed nothing to deploy).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
