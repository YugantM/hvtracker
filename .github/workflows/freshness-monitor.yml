name: Data freshness monitor

# On 22 Sep 2026 the refresh scheduler never started after a deploy and the
# site served day-old data for 30+ hours while /healthz said "ok". This polls
# /healthz every 3 hours and opens (or updates) a `stale-data` issue when the
# scheduler is down, the data is older than 12 h, or the last refresh failed;
# it closes the issue again once the site is healthy.

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check /healthz
        id: check
        run: |
          set +e
          out=$(python scripts/check_freshness.py); code=$?
          echo "$out"
          {
            echo "report<<EOF"
            echo "$out"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ $code -eq 2 ]; then echo "state=alert" >> "$GITHUB_OUTPUT";
          elif [ $code -eq 0 ]; then echo "state=ok" >> "$GITHUB_OUTPUT";
          else echo "state=error" >> "$GITHUB_OUTPUT"; fi

      - name: Open or update stale-data issue
        if: steps.check.outputs.state == 'alert' || steps.check.outputs.state == 'error'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through env, never pasted into the script (see bill-monitor.yml).
          REPORT: ${{ steps.check.outputs.report }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body=$(printf 'hvtracker.net is serving stale data or its refresh scheduler is down.\n\n```\n%s\n```\n\nRun: %s\n' "$REPORT" "$run_url")
          gh label create stale-data --repo "$GITHUB_REPOSITORY" --color D93F0B --description "Site data not refreshing" 2>/dev/null || true
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label stale-data --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "hvtracker.net data is stale" --label stale-data --body "$body"
          fi

      - name: Close stale-data issue when healthy
        if: steps.check.outputs.state == 'ok'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label stale-data --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "Recovered: /healthz reports fresh data and a running scheduler."
          fi
