name: Data freshness monitor

# On 22 Sep 2026 the refresh scheduler never started after a deploy and the
# site served day-old data for 30+ hours while /healthz said "ok". This polls
# /healthz every 3 hours and opens (or updates) a `stale-data` issue when the
# scheduler is down, the data is older than 12 h, or the last refresh failed;
# it closes the issue again once the site is healthy. From 22 to 28 Oct every
# render crashed after writing data.json, so /healthz looked fresh while the
# pages were days old (#380): it also alerts when build_report.json or
# sitemap.xml is older than 9 h. A failing offsite history backup gets its own
# `backup-failing` issue, because the site itself is fine then.

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check /healthz, the latest render and the history backup
        id: check
        run: |
          set +e
          out=$(python scripts/check_freshness.py); code=$?
          echo "$out"
          {
            echo "report<<EOF"
            echo "$out"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          # 3 = only the backup fails, so the site itself is healthy.
          if [ $code -eq 2 ]; then echo "state=alert" >> "$GITHUB_OUTPUT";
          elif [ $code -eq 0 ] || [ $code -eq 3 ]; then echo "state=ok" >> "$GITHUB_OUTPUT";
          else echo "state=error" >> "$GITHUB_OUTPUT"; fi
          # Unknown when build_report.json could not be read: leave that issue alone.
          if grep -q '^::BACKUP::' <<<"$out"; then echo "backup=failing" >> "$GITHUB_OUTPUT";
          elif grep -q '^build_report generated_at:' <<<"$out"; then echo "backup=ok" >> "$GITHUB_OUTPUT";
          else echo "backup=unknown" >> "$GITHUB_OUTPUT"; fi

      - name: Open or update stale-data issue
        if: steps.check.outputs.state == 'alert' || steps.check.outputs.state == 'error'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through env, never pasted into the script (see bill-monitor.yml).
          REPORT: ${{ steps.check.outputs.report }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body=$(printf 'hvtracker.net is serving stale data or pages, or its refresh scheduler is down.\n\n```\n%s\n```\n\nRun: %s\n' "$REPORT" "$run_url")
          gh label create stale-data --repo "$GITHUB_REPOSITORY" --color D93F0B --description "Site data not refreshing" 2>/dev/null || true
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label stale-data --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "hvtracker.net data is stale" --label stale-data --body "$body"
          fi

      - name: Close stale-data issue when healthy
        if: steps.check.outputs.state == 'ok'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label stale-data --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "Recovered: fresh data and pages, and a running scheduler."
          fi

      - name: Open or update backup-failing issue
        if: steps.check.outputs.backup == 'failing'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ steps.check.outputs.report }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body=$(printf 'The daily history snapshot is not reaching the offsite bucket. The volume still has it, and the site may be fine: see the report.\n\n```\n%s\n```\n\nRun: %s\n' "$REPORT" "$run_url")
          gh label create backup-failing --repo "$GITHUB_REPOSITORY" --color FBCA04 --description "History snapshots not reaching the bucket" 2>/dev/null || true
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label backup-failing --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "hvtracker.net history backup is failing" --label backup-failing --body "$body"
          fi

      - name: Close backup-failing issue when the backup works
        if: steps.check.outputs.backup == 'ok'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label backup-failing --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "Recovered: the daily history snapshot reaches the bucket again."
          fi
