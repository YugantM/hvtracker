name: Discover agent candidates

on:
  schedule:
    # Every Sunday at 12:00 UTC
    - cron: "0 12 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Run discovery
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python discover_agents.py

      - name: Auto-add candidates that pass OSSF Scorecard
        if: hashFiles('candidates.json') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python auto_add_agents.py

      - name: Commit updated agents.json
        if: hashFiles('candidates.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agents.json
          git diff --cached --quiet || git commit -m "chore: auto-add agents passing OSSF Scorecard ($(date -u '+%Y-%m-%d'))"
          git pull --rebase origin main || true
          git push

      - name: Open issue summarising what was added
        if: hashFiles('candidates.json') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          WEEK=$(date -u '+%Y-%m-%d')
          COUNT=$(python3 -c "import json; print(len(json.load(open('candidates.json'))))")

          # Build markdown table of top 50 candidates (all checked, top shown)
          TABLE=$(python3 - <<'PYEOF'
          import json
          MAX_ROWS = 50
          with open('candidates.json') as f:
              candidates = json.load(f)
          shown = candidates[:MAX_ROWS]
          lines = ['| Repo | Stars | Language | License | Last Push | Description |',
                   '|------|-------|----------|---------|-----------|-------------|']
          for c in shown:
              repo_link = f"[{c['repo']}]({c['url']})"
              desc = c['description'][:80].replace('|', '\\|') if c['description'] else '—'
              lines.append(f"| {repo_link} | {c['stars']:,} | {c['language'] or '—'} | {c['license']} | {c['last_push']} | {desc} |")
          if len(candidates) > MAX_ROWS:
              lines.append(f'| … | | | | | _and {len(candidates) - MAX_ROWS} more — see candidates.json_ |')
          print('\n'.join(lines))
          PYEOF
          )

          gh issue create \
            --title "🔍 Agent discovery — week of ${WEEK} (${COUNT} candidates, auto-added those with OSSF score)" \
            --label "agent-candidate" \
            --body "## Agent discovery — ${WEEK}

          Found **${COUNT}** candidate(s) passing automated eligibility pre-checks. Those with an OSSF Scorecard score (any) were auto-added to \`agents.json\` in this run.

          Remaining candidates without a Scorecard score require manual review against the [Eligibility Specification](https://hvtracker.net/spec/eligibility/v1.0) before adding.

          **Top ${COUNT} candidates by stars (all found, not just added):**

          ${TABLE}

          ---
          _Category assignments for auto-added agents are inferred from GitHub topics — review and correct in \`agents.json\` as needed._"
