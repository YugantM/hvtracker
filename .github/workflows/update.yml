name: Update leaderboard

on:
  push:
    branches: [main]
    paths:
      - agents.json
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "pending"
        type: choice
        options:
          - full
          - render
          - pending

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ inputs.mode }}" = "render" ]; then
            echo "args=--render-only" >> $GITHUB_OUTPUT
            echo "Running RENDER-ONLY (no API calls)"
          elif [ "${{ inputs.mode }}" = "full" ]; then
            echo "args=" >> $GITHUB_OUTPUT
            echo "Running full rebuild"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "args=--pending-only" >> $GITHUB_OUTPUT
            echo "Running PENDING-ONLY refresh for agents.json change"
          else
            echo "args=--pending-only" >> $GITHUB_OUTPUT
            echo "Running PENDING-ONLY refresh"
          fi

      - name: Fetch data and build
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python fetch_and_build.py ${{ steps.mode.outputs.args }}

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data.json methodology.html output/history/ output/methodology.html agents/ sitemap.xml feed.json data/ spec/ badge/ categories/ blog/ compare/ llms.txt robots.txt roadmap/ badges/
          if git diff --cached --quiet; then
            echo "No changes — skipping commit."
          else
            git commit -m "chore: regenerate leaderboard $(date -u '+%Y-%m-%d %H:%M') ${{ steps.mode.outputs.args }}"
            for i in 1 2 3; do
              git push && break
              echo "Push failed (attempt $i/3), pulling with auto-resolve..."
              git fetch origin main
              git reset --soft origin/main
              git commit -m "chore: regenerate leaderboard $(date -u '+%Y-%m-%d %H:%M') ${{ steps.mode.outputs.args }}"
            done
          fi
