name: Update leaderboard

on:
  schedule:
    # Staggered batches — each batch refreshes ~29 agents, full cycle in 24h
    - cron: "0 0 * * *"   # Batch 1/6 at 00:00 UTC
    - cron: "0 4 * * *"   # Batch 2/6 at 04:00 UTC
    - cron: "0 8 * * *"   # Batch 3/6 at 08:00 UTC
    - cron: "0 12 * * *"  # Batch 4/6 at 12:00 UTC
    - cron: "0 16 * * *"  # Batch 5/6 at 16:00 UTC
    - cron: "0 20 * * *"  # Batch 6/6 at 20:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - batch
          - mega
          - render

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine batch number
        id: batch
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Use hour ranges to tolerate GitHub's cron delays (up to ~4h late)
            HOUR=$(date -u +%-H)
            if   [ $HOUR -ge 0  ] && [ $HOUR -lt 4  ]; then BATCH="1/6"
            elif [ $HOUR -ge 4  ] && [ $HOUR -lt 8  ]; then BATCH="2/6"
            elif [ $HOUR -ge 8  ] && [ $HOUR -lt 12 ]; then BATCH="3/6"
            elif [ $HOUR -ge 12 ] && [ $HOUR -lt 16 ]; then BATCH="4/6"
            elif [ $HOUR -ge 16 ] && [ $HOUR -lt 20 ]; then BATCH="5/6"
            else BATCH="6/6"
            fi
            echo "args=--batch $BATCH" >> $GITHUB_OUTPUT
            echo "Running batch $BATCH (hour=$HOUR)"
          elif [ "${{ inputs.mode }}" = "render" ]; then
            # Render-only: rebuild all pages from data/render_state.json with
            # NO API calls. Use for UI/template changes — runs in seconds.
            echo "args=--render-only" >> $GITHUB_OUTPUT
            echo "Running RENDER-ONLY (no API calls)"
          elif [ "${{ inputs.mode }}" = "mega" ]; then
            # Mega mode: full rebuild with no batch — refreshes ALL agents
            echo "args=" >> $GITHUB_OUTPUT
            echo "Running MEGA full rebuild (all agents)"
          elif [ "${{ inputs.mode }}" = "batch" ]; then
            # Manual batch trigger — pick batch based on current hour
            HOUR=$(date -u +%-H)
            BATCH_NUM=$(( (HOUR / 4) + 1 ))
            [ $BATCH_NUM -gt 6 ] && BATCH_NUM=6
            echo "args=--batch $BATCH_NUM/6" >> $GITHUB_OUTPUT
            echo "Running manual batch $BATCH_NUM/6"
          else
            echo "args=" >> $GITHUB_OUTPUT
            echo "Running full rebuild"
          fi

      - name: Fetch data and build index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python fetch_and_build.py ${{ steps.batch.outputs.args }}

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data.json methodology.html output/history/ output/methodology.html agents/ sitemap.xml feed.json data/ spec/ badge/ categories/ blog/
          if git diff --cached --quiet; then
            echo "No changes — skipping commit."
          else
            git commit -m "chore: regenerate leaderboard $(date -u '+%Y-%m-%d %H:%M') ${{ steps.batch.outputs.args }}"
            # Retry push up to 3 times — pull with ours strategy to avoid
            # merge conflicts on auto-generated files
            for i in 1 2 3; do
              git push && break
              echo "Push failed (attempt $i/3), pulling with auto-resolve..."
              git fetch origin main
              git reset --soft origin/main
              git commit -m "chore: regenerate leaderboard $(date -u '+%Y-%m-%d %H:%M') ${{ steps.batch.outputs.args }}"
            done
          fi
