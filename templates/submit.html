<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submit an agent — HVTracker</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/site.css">
  <style>
    body { background: var(--bg); }
    .wrap { max-width: 560px; margin: 0 auto; padding: 2rem 1rem 3rem; }
    .back { font: 12px var(--font-mono); margin-bottom: 1.5rem; }
    .back a { color: var(--muted); text-decoration: none; }
    .back a:hover { color: var(--accent); }
    h1 { font-size: 1.4rem; }
    label { display: block; margin: 1rem 0 .25rem; font-weight: 600; font-size: .9rem; }
    input, textarea { width: 100%; padding: .6rem; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; box-sizing: border-box; background: #fff; }
    button { margin-top: 1.5rem; padding: .7rem 1.4rem; background: var(--accent); color: #fff; border: 0; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    button:hover { filter: brightness(1.08); }
    p.hint { color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="back"><a href="/">← HVTracker leaderboard</a></p>
    <h1>Submit an agent for listing</h1>
    <p class="hint">Submissions enter a moderation queue and appear after review.</p>
    <form method="post" action="/submit">
      <label for="repo">GitHub repo (owner/name)</label>
      <input id="repo" name="repo" placeholder="owner/name" required>
      <label for="name">Display name</label>
      <input id="name" name="name" placeholder="My Agent" required>
      <label for="category">Category (optional)</label>
      <input id="category" name="category" placeholder="Coding Agents">
      <label for="contact">Contact email (optional)</label>
      <input id="contact" name="contact" type="email" placeholder="you@example.com">
      <button type="submit">Submit for review</button>
    </form>
  </main>
</body>
</html>
