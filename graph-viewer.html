<style>
:root {
  --paper: #f4f1eb; --paper-2: #ece4d6; --ink: #1f1b17;
  --line: #d5cbbc; --line-strong: #b9aa96;
  --muted: #6b6560; --muted-2: #8a7f72;
  --lobster: #c67c6d; --lobster-soft: rgba(198,124,109,.14);
  --moss: #6f876e; --moss-soft: rgba(111,135,110,.14);
  --blue: #a7bfd9; --blue-strong: #7f9cbd; --blue-soft: rgba(167,191,217,.18);
  --accent: #26405e; --accent-warm: #b05a3a;
  --green: #2f6846; --red: #9b3c3c; --amber: #8b6914;
  --surface: #eae6de; --border: #d4cfc5;
  --font-sans: "Hanken Grotesk", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font-sans); background:var(--paper); color:var(--ink); overflow:hidden; height:100vh; }

/* ── Toolbar ── */
#toolbar {
  position:fixed; top:0; left:0; right:0; z-index:10;
  background:rgba(244,241,235,.96); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:10px 20px; display:flex; flex-wrap:wrap; gap:10px; align-items:center;
}
#toolbar .brand {
  font-weight:700; font-size:15px; letter-spacing:-.3px; margin-right:4px;
  color:var(--ink); white-space:nowrap;
}
#toolbar .brand span { color:var(--accent-warm); }

#search {
  background:var(--surface); border:1px solid var(--border); border-radius:6px;
  padding:6px 12px; color:var(--ink); font-size:13px; width:180px;
  outline:none; font-family:var(--font-sans);
}
#search:focus { border-color:var(--accent); }
#search::placeholder { color:var(--muted-2); }

.sep { width:1px; height:24px; background:var(--line); margin:0 2px; }

/* ── Dropdown multi-select ── */
.dropdown { position:relative; display:inline-block; }
.dropdown-toggle {
  display:flex; align-items:center; gap:6px; cursor:pointer;
  padding:5px 12px; border-radius:6px; border:1px solid var(--border);
  background:var(--surface); font-size:13px; font-family:var(--font-sans);
  color:var(--ink); user-select:none; white-space:nowrap;
}
.dropdown-toggle:hover { border-color:var(--line-strong); }
.dropdown-toggle .count {
  background:var(--accent-warm); color:#fff; font-size:10px; font-weight:600;
  border-radius:10px; padding:0 6px; min-width:18px; text-align:center; line-height:18px;
}
.dropdown-toggle svg { width:10px; height:10px; fill:var(--muted); flex-shrink:0; }
.dropdown-menu {
  display:none; position:absolute; top:calc(100% + 4px); left:0;
  background:var(--paper); border:1px solid var(--line); border-radius:8px;
  box-shadow:0 8px 24px rgba(31,27,23,.12); padding:4px 0; min-width:200px;
  z-index:100;
}
.dropdown.open .dropdown-menu { display:block; }
.dropdown-item {
  display:flex; align-items:center; gap:8px; padding:7px 14px; cursor:pointer;
  font-size:13px; color:var(--ink); transition:background .1s;
}
.dropdown-item:hover { background:var(--surface); }
.dropdown-item .cb {
  width:16px; height:16px; border-radius:4px; border:1.5px solid var(--line-strong);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  transition:all .15s;
}
.dropdown-item.checked .cb {
  border-color:transparent;
}
.dropdown-item .cb svg { width:10px; height:10px; fill:#fff; display:none; }
.dropdown-item.checked .cb svg { display:block; }
.dropdown-item .dot {
  width:8px; height:8px; border-radius:50%; flex-shrink:0;
}

/* ── Tooltip ── */
#tooltip {
  position:fixed; display:none;
  background:rgba(244,241,235,.97); backdrop-filter:blur(12px);
  border:1px solid var(--line); border-radius:8px;
  padding:12px 16px; font-size:13px; pointer-events:none;
  max-width:300px; z-index:20;
  box-shadow:0 6px 24px rgba(31,27,23,.12);
}
#tooltip .name { font-weight:600; font-size:14px; margin-bottom:3px; color:var(--ink); }
#tooltip .type { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px; font-family:var(--font-mono); }
#tooltip .detail { margin-top:6px; font-size:12px; color:var(--muted-2); }
#tooltip .detail strong { color:var(--ink); }

/* ── Stats & help ── */
#stats { position:fixed; bottom:16px; left:16px; z-index:10; font-size:11px; color:var(--muted); line-height:1.6; font-family:var(--font-mono); }
#help { position:fixed; bottom:16px; right:16px; z-index:10; font-size:11px; color:var(--muted-2); text-align:right; line-height:1.8; }
svg { display:block; }
</style>

,"dst":"provider/google-gemini"},{"src":"myshell-ai/AIlice","rel":"USES_PROVIDER","dst":"provider/openai"},{"src":"myshell-ai/AIlice","rel":"IN_CATEGORY","dst":"category/agent-frameworks"},{"src":"myshell-ai/AIlice","rel":"OWNED_BY","dst":"org/myshell-ai"},{"src":"roboflow/supervision","rel":"IN_CATEGORY","dst":"category/needs-review"},{"src":"roboflow/supervision","rel":"OWNED_BY","dst":"org/roboflow"},{"src":"Gentleman-Programming/engram","rel":"USES_PROVIDER","dst":"provider/google-gemini"},{"src":"Gentleman-Programming/engram","rel":"USES_PROVIDER","dst":"provider/postgres"},{"src":"Gentleman-Programming/engram","rel":"IN_CATEGORY","dst":"category/needs-review"},{"src":"Gentleman-Programming/engram","rel":"OWNED_BY","dst":"org/Gentleman-Programming"},{"src":"eugeniughelbur/obsidian-second-brain","rel":"USES_PROVIDER","dst":"provider/anthropic"},{"src":"eugeniughelbur/obsidian-second-brain","rel":"USES_PROVIDER","dst":"provider/google-gemini"},{"src":"eugeniughelbur/obsidian-second-brain","rel":"USES_PROVIDER","dst":"provider/openai"},{"src":"eugeniughelbur/obsidian-second-brain","rel":"IN_CATEGORY","dst":"category/needs-review"},{"src":"eugeniughelbur/obsidian-second-brain","rel":"OWNED_BY","dst":"org/eugeniughelbur"},{"src":"RyanCodrai/turbovec","rel":"IN_CATEGORY","dst":"category/needs-review"},{"src":"RyanCodrai/turbovec","rel":"OWNED_BY","dst":"org/RyanCodrai"},{"src":"plandex-ai/plandex","rel":"USES_PROVIDER","dst":"provider/anthropic"},{"src":"plandex-ai/plandex","rel":"USES_PROVIDER","dst":"provider/openai"},{"src":"plandex-ai/plandex","rel":"IN_CATEGORY","dst":"category/coding-agents"},{"src":"plandex-ai/plandex","rel":"OWNED_BY","dst":"org/plandex-ai"},{"src":"activeloopai/hivemind","rel":"IN_CATEGORY","dst":"category/needs-review"},{"src":"activeloopai/hivemind","rel":"OWNED_BY","dst":"org/activeloopai"},{"src":"TencentCloud/TencentDB-Agent-Memory","rel":"IN_CATEGORY","dst":"category/needs-review"},{"src":"TencentCloud/TencentDB-Agent-Memory","rel":"OWNED_BY","dst":"org/TencentCloud"},{"src":"luongnv89/asm","rel":"IN_CATEGORY","dst":"category/needs-review"},{"src":"luongnv89/asm","rel":"OWNED_BY","dst":"org/luongnv89"},{"src":"hyperbrowserai/HyperAgent","rel":"IN_CATEGORY","dst":"category/needs-review"},{"src":"hyperbrowserai/HyperAgent","rel":"OWNED_BY","dst":"org/hyperbrowserai"},{"src":"a16z-infra/ai-town","rel":"IN_CATEGORY","dst":"category/needs-review"},{"src":"a16z-infra/ai-town","rel":"OWNED_BY","dst":"org/a16z-infra"},{"src":"HKUDS/ClawWork","rel":"IN_CATEGORY","dst":"category/needs-review"},{"src":"HKUDS/ClawWork","rel":"OWNED_BY","dst":"org/HKUDS"}]};
const TYPE_CFG = {
  project:  {color:'#b05a3a', label:'Project',  r:6,  on:true},
  provider: {color:'#2f6846', label:'Provider', r:14, on:true},
  category: {color:'#8b6914', label:'Category', r:12, on:true},
  org:      {color:'#7f9cbd', label:'Org',      r:3,  on:false}
};
const REL_CFG = {
  USES_PROVIDER:  {color:'#2f6846', label:'Uses provider',  on:true},
  IN_CATEGORY:    {color:'#8b6914', label:'In category',    on:true},
  OWNED_BY:       {color:'#7f9cbd', label:'Owned by',       on:false},
  SUPPORTS_MCP:   {color:'#9b3c3c', label:'Supports MCP',   on:true},
  HAS_PROVENANCE: {color:'#6f876e', label:'Has provenance', on:true}
};

const W = window.innerWidth, H = window.innerHeight;
const svg = d3.select('#graph').attr('width',W).attr('height',H);
const g = svg.append('g');
const gLinks = g.append('g');
const gNodes = g.append('g');
const tooltip = document.getElementById('tooltip');

const zoom = d3.zoom().scaleExtent([0.1,6]).on('zoom',e=>g.attr('transform',e.transform));
svg.call(zoom);
svg.on('click',e=>{if(e.target===svg.node()){resetHL();closeDropdowns()}});

/* ── Dropdown builders ── */
function buildDropdown(menuEl, toggleEl, countEl, cfg, onChange) {
  Object.entries(cfg).forEach(([key, val]) => {
    const item = document.createElement('div');
    item.className = 'dropdown-item' + (val.on ? ' checked' : '');
    item.innerHTML =
      '<div class="cb" style="background:' + (val.on ? val.color : 'transparent') + '"><svg viewBox="0 0 12 10"><polyline points="1 5 4.5 8.5 11 1.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
      '<span class="dot" style="background:' + val.color + '"></span>' +
      '<span>' + val.label + '</span>';
    item.addEventListener('click', e => {
      e.stopPropagation();
      val.on = !val.on;
      item.classList.toggle('checked', val.on);
      item.querySelector('.cb').style.background = val.on ? val.color : 'transparent';
      countEl.textContent = Object.values(cfg).filter(v=>v.on).length;
      onChange();
    });
    menuEl.appendChild(item);
  });
  countEl.textContent = Object.values(cfg).filter(v=>v.on).length;
}

function closeDropdowns() {
  document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
}

document.getElementById('type-toggle').addEventListener('click', e => {
  e.stopPropagation();
  const dd = document.getElementById('type-dropdown');
  const wasOpen = dd.classList.contains('open');
  closeDropdowns();
  if (!wasOpen) dd.classList.add('open');
});
document.getElementById('rel-toggle').addEventListener('click', e => {
  e.stopPropagation();
  const dd = document.getElementById('rel-dropdown');
  const wasOpen = dd.classList.contains('open');
  closeDropdowns();
  if (!wasOpen) dd.classList.add('open');
});
document.addEventListener('click', closeDropdowns);

buildDropdown(
  document.getElementById('type-menu'),
  document.getElementById('type-toggle'),
  document.getElementById('type-count'),
  TYPE_CFG, rebuild
);
buildDropdown(
  document.getElementById('rel-menu'),
  document.getElementById('rel-toggle'),
  document.getElementById('rel-count'),
  REL_CFG, rebuild
);

let allNodes, allEdges, sim;
const nodeMap = new Map();
Object.entries(GRAPH_DATA.entities).forEach(([id,v]) => {
  nodeMap.set(id, {id, type:v.type, name:v.name||id.split('/').pop(), trust_score:v.trust_score, rank:v.rank});
});
allNodes = [...nodeMap.values()];
allEdges = GRAPH_DATA.edges.map(e => ({source:e.src, target:e.dst, rel:e.rel}));

let linkSel, nodeSel;
let searchTerm = '';
document.getElementById('search').addEventListener('input', e => {
  searchTerm = e.target.value.toLowerCase(); applyHL();
});

function rebuild() {
  const activeTypes = new Set(Object.entries(TYPE_CFG).filter(([,v])=>v.on).map(([k])=>k));
  const activeRels = new Set(Object.entries(REL_CFG).filter(([,v])=>v.on).map(([k])=>k));
  const fNodes = allNodes.filter(n => activeTypes.has(n.type));
  const fIds = new Set(fNodes.map(n=>n.id));
  const fEdges = allEdges.filter(e => activeRels.has(e.rel) && fIds.has(e.source) && fIds.has(e.target));
  const connIds = new Set(); fEdges.forEach(e=>{connIds.add(e.source);connIds.add(e.target)});
  const visNodes = fNodes.filter(n => connIds.has(n.id) || n.type!=='project');
  const nodes = visNodes.map(n=>({...n}));
  const nIdx = new Set(nodes.map(n=>n.id));
  const links = fEdges.filter(e=>nIdx.has(e.source)&&nIdx.has(e.target)).map(e=>({...e}));

  if(sim) sim.stop();
  sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d=>d.id)
      .distance(d => d.rel==='IN_CATEGORY'?90 : d.rel==='USES_PROVIDER'?70 : 50)
      .strength(d => d.rel==='USES_PROVIDER'?.2:.4))
    .force('charge', d3.forceManyBody().strength(d =>
      d.type==='provider'?-400 : d.type==='category'?-350 : -30))
    .force('center', d3.forceCenter(W/2, H/2))
    .force('collision', d3.forceCollide().radius(d=>nr(d)+3))
    .force('x', d3.forceX(W/2).strength(.02))
    .force('y', d3.forceY(H/2).strength(.02));

  linkSel = gLinks.selectAll('line').data(links, d=>(d.source.id||d.source)+'-'+(d.target.id||d.target)+'-'+d.rel);
  linkSel.exit().remove();
  linkSel = linkSel.enter().append('line')
    .attr('stroke', d=>REL_CFG[d.rel]?.color||'#b9aa96')
    .attr('stroke-opacity',.25)
    .attr('stroke-width',.6)
    .merge(linkSel);

  nodeSel = gNodes.selectAll('g.nd').data(nodes, d=>d.id);
  nodeSel.exit().remove();
  const ne = nodeSel.enter().append('g').attr('class','nd').style('cursor','pointer');
  ne.append('circle')
    .attr('r', d=>nr(d))
    .attr('fill', d=>TYPE_CFG[d.type]?.color||'#8a7f72')
    .attr('stroke', 'rgba(31,27,23,.1)')
    .attr('stroke-width',.5);
  ne.append('text')
    .text(d=>(d.type==='provider'||d.type==='category')?d.name:'')
    .attr('text-anchor','middle')
    .attr('dy', d=>nr(d)+14)
    .attr('font-size','10px')
    .attr('fill', 'var(--muted)')
    .attr('font-family','var(--font-sans)');
  nodeSel = ne.merge(nodeSel);
  nodeSel.select('circle').attr('r',d=>nr(d)).attr('fill',d=>TYPE_CFG[d.type]?.color||'#8a7f72');

  nodeSel.on('mouseover', (ev,d) => {
    const cn = links.filter(l=>(l.source.id||l.source)===d.id||(l.target.id||l.target)===d.id);
    const nb = new Set(cn.flatMap(l=>[l.source.id||l.source,l.target.id||l.target])); nb.add(d.id);
    linkSel.attr('stroke-opacity', l=>nb.has(l.source.id||l.source)&&nb.has(l.target.id||l.target)?.7:.04)
           .attr('stroke-width', l=>nb.has(l.source.id||l.source)&&nb.has(l.target.id||l.target)?1.5:.6);
    nodeSel.select('circle').attr('opacity', n=>nb.has(n.id)?1:.08);
    nodeSel.select('text').attr('opacity', n=>nb.has(n.id)?1:.05);
    tooltip.querySelector('.name').textContent = d.name;
    tooltip.querySelector('.type').textContent = TYPE_CFG[d.type]?.label || d.type;
    let det = '';
    if(d.trust_score) det += 'Trust: <strong>'+d.trust_score+'</strong><br>';
    if(d.rank) det += 'Rank: #'+d.rank+'<br>';
    det += cn.length+' connections';
    tooltip.querySelector('.detail').innerHTML = det;
    tooltip.style.display = 'block';
    tooltip.style.left = (ev.clientX+14)+'px'; tooltip.style.top = (ev.clientY-10)+'px';
  })
  .on('mousemove', ev => {
    tooltip.style.left = (ev.clientX+14)+'px'; tooltip.style.top = (ev.clientY-10)+'px';
  })
  .on('mouseout', () => {
    tooltip.style.display = 'none';
    if(!searchTerm) resetHL();
  });

  nodeSel.call(d3.drag()
    .on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y})
    .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y})
    .on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));

  sim.on('tick', () => {
    linkSel.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
           .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    nodeSel.attr('transform', d=>'translate('+d.x+','+d.y+')');
  });

  document.getElementById('stats').innerHTML =
    'Nodes: '+nodes.length+' · Edges: '+links.length+
    '<br>Generated: '+GRAPH_DATA.generated_at;
}

function nr(d) {
  if(d.type==='provider') return 14;
  if(d.type==='category') return 12;
  if(d.type==='org') return 3;
  return d.trust_score ? 3+(d.trust_score/100)*7 : 5;
}
function resetHL() {
  if(!linkSel) return;
  linkSel.attr('stroke-opacity',.25).attr('stroke-width',.6);
  nodeSel.select('circle').attr('opacity',1);
  nodeSel.select('text').attr('opacity',1);
}
function applyHL() {
  if(!nodeSel) return;
  if(!searchTerm){resetHL();return}
  nodeSel.select('circle').attr('opacity', d=>d.name.toLowerCase().includes(searchTerm)?1:.06);
  nodeSel.select('text').attr('opacity', d=>d.name.toLowerCase().includes(searchTerm)?1:.03);
}

rebuild();
window.addEventListener('resize', () => {
  const w=window.innerWidth, h=window.innerHeight;
  svg.attr('width',w).attr('height',h);
});
</script>
