<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0c0c15"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>
  <rect x="96" y="96" width="1008" height="438" rx="24" fill="#13131f" stroke="#252538" stroke-width="2"/>
  <rect x="96" y="96" width="1008" height="8" rx="4" fill="#7c6af6"/>

  <text x="144" y="210" font-family="JetBrains Mono, Fira Mono, ui-monospace, monospace" font-size="72" font-weight="700" fill="#eeeef5">HV<tspan fill="#7c6af6">Tracker</tspan></text>
  <text x="148" y="272" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="600" fill="#c4a882">AI Agent Trust Registry</text>
  <text x="148" y="330" font-family="Inter, system-ui, sans-serif" font-size="26" fill="#eeeef5">Evidence-weighted rankings for open-source AI agents</text>

  <g font-family="JetBrains Mono, Fira Mono, ui-monospace, monospace" font-size="23" fill="#8a87a8">
    <text x="148" y="412">171 agents</text>
    <text x="345" y="412">14 categories</text>
    <text x="580" y="412">trust, safety, activity, adoption</text>
  </g>

  <g font-family="Inter, system-ui, sans-serif" font-size="18" fill="#8a87a8">
    <text x="148" y="470">Public signals from GitHub, package registries, OSSF Scorecard, provenance, HN, and history.</text>
    <text x="148" y="504">v1 launch - hvtracker.net</text>
  </g>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0c0c15"/>
      <stop offset="0.62" stop-color="#10101c"/>
      <stop offset="1" stop-color="#17142a"/>
    </linearGradient>
  </defs>
</svg>
